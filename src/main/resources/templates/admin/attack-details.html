<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attack Details</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
    body{ background:#0B0F19; color:#fff; font-family:'Poppins', sans-serif; min-height:100vh; display:flex; align-items:center; }
    .card{ background:#121827; border:1px solid rgba(0,229,255,0.2); border-radius:20px; overflow:hidden; box-shadow:0 0 30px rgba(0,229,255,0.1); }
    .card-header{ background: linear-gradient(90deg, #121827, #1a233a); border-bottom:1px solid rgba(0,229,255,0.2); padding:20px; }
    .table tr{ border-color: rgba(255,255,255,0.08); transition:.2s; }
    .table tr:hover{ background:rgba(0,229,255,0.05); }
    .table th{ color:#aab; font-weight:400; width:250px; padding:18px !important; }
    .table td{ color:#fff; font-weight:600; padding:18px !important; }
    .risk-bar{ height:8px; border-radius:10px; background:#212529; overflow:hidden; margin-top:8px; }
    .risk-fill{ height:100%; transition:1s ease-in-out; }
    .icon-box{ width:45px; height:45px; display:inline-flex; align-items:center; justify-content:center; background:rgba(0,229,255,0.1); border-radius:10px; color:#00E5FF; margin-right:10px; }
    .copy-btn{ cursor:pointer; color:#00E5FF; transition:.2s; }
    .copy-btn:hover{ color:#fff; transform:scale(1.2); }
    .btn-back{ background:transparent; border:1px solid #00E5FF; color:#00E5FF; transition:.3s; }
    .btn-back:hover{ background:#00E5FF; color:#000; transform:translateX(-5px); }
</style>
</head>
<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-lg-8">

<div class="card shadow">
<div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="mb-0"><i class="fas fa-bug me-2" style="color:#ff4444"></i> Attack Details <span class="badge bg-dark ms-2" style="border:1px solid #00E5FF" th:text="'#'+${attack.id}">#101</span></h3>
    <span th:if="${attack.riskLevel=='HIGH'}" class="badge bg-danger" style="box-shadow:0 0 15px #ff4444; animation: pulse 1.5s infinite;"><i class="fa-solid fa-triangle-exclamation"></i> HIGH RISK</span>
    <span th:if="${attack.riskLevel=='MEDIUM'}" class="badge bg-warning text-dark"><i class="fa-solid fa-circle-exclamation"></i> MEDIUM</span>
    <span th:if="${attack.riskLevel=='LOW'}" class="badge bg-success"><i class="fa-solid fa-shield-halved"></i> LOW</span>
</div>

<div class="card-body p-0">
<table class="table table-bordered m-0">
<tr>
<th><span class="icon-box"><i class="fa-solid fa-fingerprint"></i></span> ID</th>
<td th:text="${attack.id}">101</td>
</tr>
<tr>
<th><span class="icon-box"><i class="fa-solid fa-network-wired"></i></span> IP Address</th>
<td>
    <span th:text="${attack.ipAddress}" id="ipText">192.168.1.10</span>
    <i class="fa-regular fa-copy ms-3 copy-btn" onclick="copyIp()" title="Copy IP"></i>
    <a th:href="'https://whatismyipaddress.com/ip/'+${attack.ipAddress}" target="_blank" class="ms-2" style="color:#7C3AED"><i class="fa-solid fa-location-dot"></i></a>
    <small class="text-success ms-2 d-none" id="copied">Copied!</small>
</td>
</tr>
<tr>
<th><span class="icon-box"><i class="fa-solid fa-earth-americas"></i></span> Country</th>
<td><i class="fa-solid fa-flag me-2 text-white-50"></i><span th:text="${attack.country}">India</span></td>
</tr>
<tr>
<th><span class="icon-box"><i class="fa-solid fa-city"></i></span> City</th>
<td th:text="${attack.city}">Pune</td>
</tr>
<tr>
<th><span class="icon-box"><i class="fa-solid fa-skull-crossbones"></i></span> Attack Type</th>
<td>
    <i class="fa-solid fa-bug me-2" style="color:#ff4444"></i>
    <span th:text="${attack.attackType}">SQL Injection</span>
</td>
</tr>
<tr>
<th><span class="icon-box"><i class="fa-solid fa-gauge-high"></i></span> Risk Level</th>
<td>
    <div th:if="${attack.riskLevel=='HIGH'}">
        <span class="badge bg-danger">HIGH</span>
        <div class="risk-bar"><div class="risk-fill bg-danger" style="width:90%; box-shadow:0 0 10px #ff4444"></div></div>
    </div>
    <div th:if="${attack.riskLevel=='MEDIUM'}">
        <span class="badge bg-warning text-dark">MEDIUM</span>
        <div class="risk-bar"><div class="risk-fill bg-warning" style="width:55%"></div></div>
    </div>
    <div th:if="${attack.riskLevel=='LOW'}">
        <span class="badge bg-success">LOW</span>
        <div class="risk-bar"><div class="risk-fill bg-success" style="width:25%"></div></div>
    </div>
</td>
</tr>
<tr>
<th><span class="icon-box"><i class="fa-solid fa-clock"></i></span> Timestamp</th>
<td th:text="${attack.timestamp}"><i class="fa-regular fa-calendar me-2"></i> 2026-09-16 14:30:22</td>
</tr>
</table>

<div class="p-4 d-flex justify-content-between align-items-center">
    <a th:href="@{/admin/attack-logs}" class="btn btn-back"><i class="fas fa-arrow-left me-2"></i> Back to Logs</a>
    <button class="btn btn-danger btn-sm" onclick="alert('Attack Blocked! IP '+document.getElementById('ipText').innerText+' blacklisted.')"><i class="fa-solid fa-ban"></i> Block IP</button>
</div>

</div>
</div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function copyIp(){
    let ip = document.getElementById('ipText').innerText;
    navigator.clipboard.writeText(ip);
    let msg = document.getElementById('copied');
    msg.classList.remove('d-none');
    setTimeout(()=> msg.classList.add('d-none'), 1500);
}
</script>
<style>@keyframes pulse { 0%{opacity:1} 50%{opacity:0.5} 100%{opacity:1} }</style>
</body>
</html>
