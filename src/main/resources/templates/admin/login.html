<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Login - Threat Intel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{
    background: #0B0F19;
    min-height: 100vh;
    display: flex;
    align-items: center;
    font-family: 'Poppins', sans-serif;
    overflow:hidden;
    position:relative;
}
/* Animated Background Glow */
body::before{
    content:'';
    position:absolute;
    width:500px; height:500px;
    background:radial-gradient(circle, rgba(255,193,7,0.15), transparent);
    top:-100px; left:-100px;
    animation: float 6s ease-in-out infinite;
}
body::after{
    content:'';
    position:absolute;
    width:600px; height:600px;
    background:radial-gradient(circle, rgba(124,58,237,0.15), transparent);
    bottom:-150px; right:-100px;
    animation: float 8s ease-in-out infinite reverse;
}
@keyframes float{ 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,30px)} }

.card{
    border: none;
    border-radius: 20px;
    background: rgba(18,24,39,0.9);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,193,7,0.3);
    box-shadow:0 0 40px rgba(255,193,7,0.1);
    position:relative;
    z-index:1;
    transition:.4s;
}
.card:hover{ box-shadow:0 0 60px rgba(255,193,7,0.2); transform:translateY(-5px); }
.form-control{
    background: #0B0F19;
    border: 1px solid rgba(255,193,7,0.2);
    color: white;
    padding-right:45px;
}
.form-control:focus{
    background: #0B0F19;
    color: white;
    border-color: #FFC107;
    box-shadow: 0 0 15px rgba(255,193,7,0.3);
}
.btn-warning{
    background: linear-gradient(90deg,#FFC107,#FF8C00);
    border: none;
    font-weight: 700;
    color: #000;
    transition:.3s;
}
.btn-warning:hover{ transform:scale(1.02); box-shadow: 0 0 25px rgba(255,193,7,0.6); color:#000; }
.eye-btn{ position:absolute; right:15px; top:50%; transform:translateY(-50%); color:#FFC107; cursor:pointer; background:none; border:none; }
.shield-anim{ animation: shieldGlow 2s infinite; }
@keyframes shieldGlow{ 0%,100%{filter:drop-shadow(0 0 10px #FFC107)} 50%{filter:drop-shadow(0 0 25px #FFC107)} }
</style>
</head>
<body>

<div class="container">
<div class="row justify-content-center">
<div class="col-md-5">

<div class="card shadow-lg">
<div class="card-body p-5">

    <div class="text-center mb-4">
        <i class="fa-solid fa-user-shield fa-3x text-warning shield-anim"></i>
        <h2 class="mt-3" style="font-weight:800">Admin Login</h2>
        <p class="text-white-50 small">Secure Access • Threat Intel System</p>
    </div>

    <div class="alert alert-danger py-2" th:if="${param.error}" style="background:rgba(255,0,0,0.1); border-color:#ff4444; color:#ff4444; font-size:14px">
        <i class="fa-solid fa-circle-xmark me-2"></i> Invalid Email or Password
    </div>
    <div class="alert alert-success py-2" th:if="${param.logout}" style="background:rgba(0,255,100,0.1); border-color:#00ff64; color:#00ff64; font-size:14px">
        <i class="fa-solid fa-circle-check me-2"></i> Logged out successfully.
    </div>

    <form th:action="@{/admin/login}" method="post" id="loginForm">
        <div class="mb-3">
            <label class="form-label small text-white-50"><i class="fa-solid fa-envelope"></i> Admin Email</label>
            <input type="email" name="username" class="form-control form-control-lg" placeholder="admin@threatintel.com" required>
        </div>
        <div class="mb-4">
            <label class="form-label small text-white-50"><i class="fa-solid fa-lock"></i> Password</label>
            <div class="position-relative">
                <input type="password" name="password" id="passInput" class="form-control form-control-lg" placeholder="••••••••" required>
                <button type="button" class="eye-btn" onclick="togglePass()"><i id="eyeIcon" class="fa-solid fa-eye"></i></button>
            </div>
        </div>
        <button class="btn btn-warning w-100 btn-lg" id="loginBtn">
            <span id="btnText"><i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard</span>
            <span id="btnLoader" class="d-none"><i class="fa-solid fa-spinner fa-spin"></i> Authenticating...</span>
        </button>
    </form>

    <hr style="border-color: rgba(255,255,255,0.1);" class="my-4">
    
    <div class="text-center">
        <a href="/login" class="text-white-50 text-decoration-none small"><i class="fa-solid fa-arrow-left"></i> Back to User Login</a>
        <p class="text-white-50 small mt-3" style="font-size:11px"><i class="fa-solid fa-lock"></i> Protected by Threat Intel Firewall v2.0</p>
    </div>

</div>
</div>

</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function togglePass(){
    let input = document.getElementById('passInput');
    let icon = document.getElementById('eyeIcon');
    if(input.type === 'password'){ input.type='text'; icon.className='fa-solid fa-eye-slash'; }
    else{ input.type='password'; icon.className='fa-solid fa-eye'; }
}
document.getElementById('loginForm').addEventListener('submit', function(){
    document.getElementById('btnText').classList.add('d-none');
    document.getElementById('btnLoader').classList.remove('d-none');
    document.getElementById('loginBtn').disabled = true;
});
</script>
</body>
</html>
