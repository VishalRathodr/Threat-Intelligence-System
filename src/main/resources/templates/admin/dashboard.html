<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard | Threat Intel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{ --bg:#0B0F19; --card:#121827; --cyan:#00E5FF; --purple:#7C3AED; --text:#fff; }
body{ background:var(--bg); color:var(--text); font-family:'Poppins', sans-serif; overflow-x:hidden; }
.sidebar{ position:fixed; left:0; top:0; width:260px; height:100vh; background:rgba(17,24,39,0.95); backdrop-filter:blur(15px); border-right:1px solid rgba(0,229,255,0.2); padding-top:20px; z-index:1000; }
.sidebar h3{ text-align:center; background:linear-gradient(90deg,var(--cyan),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-weight:800; margin-bottom:30px; }
.sidebar a{ display:block; padding:13px 25px; color:#aaa; text-decoration:none; transition:.3s; margin:4px 10px; border-radius:8px; }
.sidebar a i{ width:25px; }
.sidebar a:hover{ background:rgba(0,229,255,0.1); color:var(--cyan); transform:translateX(5px); }
.sidebar a.active{ background:linear-gradient(90deg,var(--cyan),var(--purple)); color:#000; font-weight:600; }
.content{ margin-left:260px; padding:30px; }
.topbar{ background:rgba(18,24,39,0.8); backdrop-filter:blur(15px); padding:18px 25px; border-radius:15px; border:1px solid rgba(0,229,255,0.2); display:flex; justify-content:space-between; align-items:center; }
.card-box{ background:rgba(18,24,39,0.8); padding:22px; border-radius:15px; text-align:center; border:1px solid rgba(0,229,255,0.2); transition:.3s; cursor:pointer; }
.card-box:hover{ transform:translateY(-8px) scale(1.02); border-color:var(--cyan); box-shadow:0 0 25px rgba(0,229,255,0.2); }
.card-box h2{ background:linear-gradient(90deg,var(--cyan),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent; font-size:38px; font-weight:800; }
.glass-card{ background:rgba(18,24,39,0.8); border-radius:15px; border:1px solid rgba(0,229,255,0.2); }
.table{ color:var(--text); }
.table tbody tr{ transition:.2s; cursor:pointer; }
.table tbody tr:hover{ background:rgba(0,229,255,0.07) !important; }
.search-box{ background:#0B0F19; border:1px solid rgba(0,229,255,0.3); color:#fff; }
.search-box:focus{ background:#0B0F19; color:#fff; border-color:var(--cyan); }
.live-dot{ width:10px; height:10px; background:#00ff64; border-radius:50%; display:inline-block; box-shadow:0 0 10px #00ff64; animation:pulse 1.5s infinite; }
@keyframes pulse{ 0%{opacity:1} 50%{opacity:.4} 100%{opacity:1} }
</style>
</head>
<body>

<div class="sidebar">
<h3><i class="fa-solid fa-shield-halved"></i> Threat Intel</h3>
<a th:href="@{/admin/dashboard}" class="active"><i class="fa-solid fa-gauge"></i> Dashboard</a>
<a th:href="@{/admin/users}"><i class="fa-solid fa-users"></i> Users</a>
<a th:href="@{/admin/admins}"><i class="fa-solid fa-user-shield"></i> Admins</a>
<a th:href="@{/admin/attack-logs}"><i class="fa-solid fa-bug"></i> Attack Logs</a>
<a th:href="@{/admin/high-risk}"><i class="fa-solid fa-triangle-exclamation"></i> High Risk</a>
<a th:href="@{/admin/threat-intelligence}"><i class="fa-solid fa-shield-virus"></i> Threat Intelligence</a>
<a th:href="@{/admin/prediction}"><i class="fa-solid fa-robot"></i> AI Prediction</a>
<a th:href="@{/admin/reports}"><i class="fa-solid fa-file"></i> Reports</a>
<a th:href="@{/logout}"><i class="fa-solid fa-right-from-bracket"></i> Logout</a>
</div>

<div class="content">
<div class="topbar mb-4">
<div>
<h2 class="m-0" style="background:linear-gradient(90deg,var(--cyan),var(--purple)); -webkit-background-clip:text; -webkit-text-fill-color:transparent;"><i class="fa-solid fa-gauge"></i> Welcome Admin</h2>
<small class="text-white-50"><span class="live-dot me-2"></span>Live Monitoring • <span id="clock"></span></small>
</div>
<div><a th:href="@{/admin/attack-logs/export}" class="btn btn-outline-info btn-sm"><i class="fa-solid fa-download"></i> Export</a></div>
</div>

<div class="row g-4 mb-4">
<div class="col-md-3"><div class="card-box" onclick="location.href='/admin/users'"><i class="fa-solid fa-users mb-2" style="color:var(--cyan)"></i><h2 class="counter" th:data-target="${totalUsers}">0</h2><p>Total Users</p></div></div>
<div class="col-md-3"><div class="card-box" onclick="location.href='/admin/admins'"><i class="fa-solid fa-user-shield mb-2" style="color:#7C3AED"></i><h2 class="counter" th:data-target="${totalAdmins}">0</h2><p>Total Admins</p></div></div>
<div class="col-md-3"><div class="card-box" onclick="location.href='/admin/attack-logs'"><i class="fa-solid fa-bug mb-2" style="color:#ff4444"></i><h2 class="counter" th:data-target="${totalAttacks}">0</h2><p>Attack Logs</p></div></div>
<div class="col-md-3"><div class="card-box" onclick="location.href='/admin/high-risk'" style="border-color:#ff4444"><i class="fa-solid fa-triangle-exclamation mb-2 text-danger"></i><h2 class="counter" th:data-target="${highRisk}">0</h2><p>High Risk</p></div></div>
</div>

<div class="row g-4 mb-4">
<div class="col-md-6">
    <div class="glass-card shadow">
        <div class="card-header bg-transparent" style="color:var(--cyan); border-bottom:1px solid rgba(0,229,255,0.2)">Risk Level Distribution</div>
        <div class="card-body" th:data-high="${highRisk}" th:data-medium="${mediumRisk}" th:data-low="${lowRisk}" style="height:300px"><canvas id="riskChart"></canvas></div>
    </div>
</div>
<div class="col-md-6">
    <div class="glass-card shadow">
        <div class="card-header bg-transparent" style="color:var(--cyan); border-bottom:1px solid rgba(0,229,255,0.2)">Attack Types</div>
        <div class="card-body" th:data-wordpress="${wordpress}" th:data-sql="${sqlInjection}" th:data-xss="${xss}" style="height:300px"><canvas id="attackChart"></canvas></div>
    </div>
</div>
</div>

<div class="d-flex justify-content-between align-items-center mb-3">
<h4><i class="fa-solid fa-clock-rotate-left"></i> Recent Attack Logs</h4>
<input type="text" id="tableSearch" class="form-control search-box w-25" placeholder="Search IP / Country...">
</div>

<div class="glass-card shadow">
<div class="card-body p-0">
<div class="table-responsive">
<table class="table table-dark table-hover mb-0 align-middle">
<thead><tr style="color:var(--cyan)"><th>ID</th><th>IP</th><th>Country</th><th>Attack</th><th>Risk</th><th>Time</th></tr></thead>
<tbody id="recentTable">
<tr th:each="attack:${attacks}" th:data-url="@{/admin/attack-details/{id}(id=${attack.id})}" onclick="window.location=this.dataset.url">
<td th:text="${attack.id}"></td>
<td th:text="${attack.ipAddress}"></td>
<td th:text="${attack.country}"></td>
<td th:text="${attack.attackType}"></td>
<td><span th:class="${attack.riskLevel == 'HIGH'? 'badge bg-danger' : (attack.riskLevel == 'MEDIUM'? 'badge bg-warning text-dark' : 'badge bg-success')}" th:text="${attack.riskLevel}"></span></td>
<td th:text="${#temporals.format(attack.timestamp,'dd-MM HH:mm')}"></td>
</tr>
</tbody>
</table>
</div>
</div>
</div>

</div>

<script>
// Clock
setInterval(()=>{ document.getElementById('clock').innerText = new Date().toLocaleString('en-IN'); },1000);

// Counter Animation
document.querySelectorAll('.counter').forEach(counter=>{
    let target = +counter.dataset.target || 0;
    let count = 0;
    let step = target / 50;
    let update = () => {
        count += step;
        if(count < target){ counter.innerText = Math.ceil(count); setTimeout(update,20); }
        else{ counter.innerText = target; }
    };
    update();
});

// Charts (same as yours)
const riskCard = document.getElementById('riskChart').parentElement;
new Chart(document.getElementById('riskChart'),{
    type:'doughnut',
    data:{ labels:['High','Medium','Low'], datasets:[{ data:[parseInt(riskCard.dataset.high||0), parseInt(riskCard.dataset.medium||0), parseInt(riskCard.dataset.low||0)], backgroundColor:['#dc3545','#ffc107','#00E5FF'], borderColor:'#121827' }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{labels:{color:'#fff'}}} }
});
const attackCard = document.getElementById('attackChart').parentElement;
new Chart(document.getElementById('attackChart'),{
    type:'bar',
    data:{ labels:['WordPress','SQL Injection','XSS'], datasets:[{ label:'Attacks', data:[parseInt(attackCard.dataset.wordpress||0), parseInt(attackCard.dataset.sql||0), parseInt(attackCard.dataset.xss||0)], backgroundColor:['#7C3AED','#dc3545','#00E5FF'], borderRadius:8 }] },
    options:{ responsive:true, maintainAspectRatio:false, scales:{ y:{beginAtZero:true, ticks:{color:'#aaa'}}, x:{ticks:{color:'#aaa'}} }, plugins:{legend:{labels:{color:'#fff'}}} }
});

// Live table search
document.getElementById('tableSearch').addEventListener('keyup', function(){
    let f = this.value.toLowerCase();
    document.querySelectorAll('#recentTable tr').forEach(r=>{
        r.style.display = r.innerText.toLowerCase().includes(f) ? '' : 'none';
    });
});
</script>
</body>
</html>
