<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Attack Logs - Threat Intel</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;800&display=swap" rel="stylesheet">
<style>
body{ background:#0B0F19; color:#fff; font-family:'Poppins', sans-serif; }
.sidebar{ width:240px; position:fixed; top:0; left:0; height:100vh; background:#121827; border-right:1px solid rgba(0,229,255,0.2); padding-top:20px; }
.sidebar h4{ color:#00E5FF; text-align:center; font-weight:800; }
.sidebar a{ display:block; color:#aab; text-decoration:none; padding:12px 20px; margin:5px 10px; border-radius:8px; transition:.3s; }
.sidebar a:hover{ background:rgba(0,229,255,0.1); color:#00E5FF; transform:translateX(5px); }
.sidebar a.active{ background:linear-gradient(90deg,#00E5FF,#7C3AED) !important; color:#000 !important; font-weight:600; }
.content{ margin-left:260px; padding:30px; }
.card{ background:#121827; border:1px solid rgba(0,229,255,0.15); border-radius:15px; }
.search-box{ background:#0B0F19; border:1px solid rgba(0,229,255,0.3); color:#fff; }
.search-box:focus{ background:#0B0F19; color:#fff; border-color:#00E5FF; }
.table-hover tbody tr{ transition:.2s; }
.table-hover tbody tr:hover{ background:rgba(0,229,255,0.07) !important; }
.modal-content{ background:#121827; border:1px solid rgba(0,229,255,0.3); }
</style>
</head>
<body>
<div class="container-fluid">
<div class="row">

<div class="sidebar p-3">
<h3 class="text-center" style="color:#00E5FF; font-weight:800">ThreatIntel</h3>
<hr style="border-color:rgba(0,229,255,0.2)">
<a th:href="@{/admin/dashboard}"><i class="fa-solid fa-chart-line me-2"></i> Dashboard</a>
<a class="active" th:href="@{/admin/attack-logs}"><i class="fa-solid fa-bug me-2"></i> Attack Logs</a>
<a th:href="@{/admin/profile}"><i class="fa-solid fa-user me-2"></i> Profile</a>
<a th:href="@{/logout}" class="text-danger mt-3"><i class="fa-solid fa-sign-out-alt me-2"></i> Logout</a>
</div>

<div class="col p-0">
<div class="content">

<div class="d-flex justify-content-between align-items-center mb-4">
<h2><i class="fa-solid fa-bug" style="color:#00E5FF"></i> Attack Logs <span class="badge ms-2" style="background:rgba(0,229,255,0.15); color:#00E5FF" th:text="${#lists.size(attacks)}">0</span></h2>
<div class="d-flex gap-2">
<input type="text" id="search" class="form-control search-box" placeholder="Search IP / City / Type..." style="width:280px">
<select id="riskFilter" class="form-select search-box" style="width:130px"><option value="">All</option><option>HIGH</option><option>MEDIUM</option><option>LOW</option></select>
</div>
</div>

<div class="card shadow">
<div class="card-body p-0">
<div class="table-responsive">
<table class="table table-dark table-hover align-middle mb-0">
<thead style="color:#00E5FF"><tr><th>ID</th><th>IP Address</th><th>Country</th><th>City</th><th>Attack Type</th><th>Risk</th><th>Timestamp</th><th width="130">Action</th></tr></thead>
<tbody id="logBody">
<tr th:each="attack : ${attacks}">
<td th:text="${attack.id}">1</td>
<td th:text="${attack.ipAddress}">192.168.1.1</td>
<td th:text="${attack.country}">India</td>
<td th:text="${attack.city}">Bangalore</td>
<td><span class="badge" style="background:rgba(124,58,237,0.2); color:#7C3AED; border:1px solid #7C3AED" th:text="${attack.attackType}">XSS</span></td>
<td>
<span th:if="${attack.riskLevel=='HIGH'}" class="badge bg-danger" style="box-shadow:0 0 10px #ff4444">HIGH</span>
<span th:if="${attack.riskLevel=='MEDIUM'}" class="badge bg-warning text-dark">MEDIUM</span>
<span th:if="${attack.riskLevel=='LOW'}" class="badge bg-success">LOW</span>
</td>
<td th:text="${attack.timestamp}">2026-09-16 10:30</td>
<td>
<a href="#" class="btn btn-sm btn-outline-info viewBtn" 
   th:data-ip="${attack.ipAddress}" 
   th:data-country="${attack.country}" 
   th:data-city="${attack.city}" 
   th:data-type="${attack.attackType}" 
   th:data-risk="${attack.riskLevel}" 
   th:data-time="${attack.timestamp}"><i class="fa-solid fa-eye"></i></a>
<a href="#" class="btn btn-sm btn-outline-danger delBtn ms-1" th:data-url="@{/admin/attack/delete/{id}(id=${attack.id})}" th:data-id="${attack.id}"><i class="fa-solid fa-trash"></i></a>
</td>
</tr>
</tbody>
</table>
</div>
</div>
</div>

</div>
</div>
</div>
</div>

<!-- View Modal -->
<div class="modal fade" id="viewModal" tabindex="-1">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header border-0"><h5 class="modal-title" style="color:#00E5FF"><i class="fa-solid fa-shield-virus"></i> Attack Details</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
<div class="modal-body">
<div class="p-3 rounded" style="background:#0B0F19; border:1px solid rgba(0,229,255,0.2)">
<p><b>IP:</b> <span id="vIp" style="color:#00E5FF"></span></p>
<p><b>Location:</b> <span id="vLoc"></span></p>
<p><b>Type:</b> <span id="vType" class="badge bg-primary"></span></p>
<p><b>Risk:</b> <span id="vRisk"></span></p>
<p><b>Time:</b> <span id="vTime" class="text-white-50"></span></p>
</div>
</div>
</div>
</div>
</div>

<!-- Delete Modal -->
<div class="modal fade" id="delModal" tabindex="-1">
<div class="modal-dialog modal-dialog-centered">
<div class="modal-content" style="border-color:#ff4444">
<div class="modal-header border-0"><h5 class="text-danger">Delete Log</h5><button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button></div>
<div class="modal-body text-center"><i class="fa-solid fa-triangle-exclamation fa-3x text-danger mb-3"></i><p>Delete log <b id="dId" style="color:#00E5FF"></b> permanently?</p></div>
<div class="modal-footer border-0 justify-content-center"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><a id="confirmDel" href="#" class="btn btn-danger">Delete</a></div>
</div>
</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
function filter(){
    let s=document.getElementById('search').value.toLowerCase();
    let r=document.getElementById('riskFilter').value;
    document.querySelectorAll('#logBody tr').forEach(row=>{
        let okS=row.innerText.toLowerCase().includes(s);
        let okR= r==='' || row.innerText.includes(r);
        row.style.display= okS && okR ? '' : 'none';
    });
}
document.getElementById('search').addEventListener('keyup', filter);
document.getElementById('riskFilter').addEventListener('change', filter);

document.querySelectorAll('.viewBtn').forEach(b=>{
    b.addEventListener('click', e=>{
        e.preventDefault();
        document.getElementById('vIp').innerText=b.dataset.ip;
        document.getElementById('vLoc').innerText=b.dataset.country+', '+b.dataset.city;
        document.getElementById('vType').innerText=b.dataset.type;
        document.getElementById('vRisk').innerText=b.dataset.risk;
        document.getElementById('vRisk').className= b.dataset.risk=='HIGH'?'badge bg-danger': b.dataset.risk=='MEDIUM'?'badge bg-warning text-dark':'badge bg-success';
        document.getElementById('vTime').innerText=b.dataset.time;
        new bootstrap.Modal(document.getElementById('viewModal')).show();
    });
});
document.querySelectorAll('.delBtn').forEach(b=>{
    b.addEventListener('click', e=>{
        e.preventDefault();
        document.getElementById('dId').innerText='#'+b.dataset.id;
        document.getElementById('confirmDel').href=b.dataset.url;
        new bootstrap.Modal(document.getElementById('delModal')).show();
    });
});
</script>
</body>
</html>
